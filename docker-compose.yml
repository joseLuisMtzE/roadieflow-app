services:
  db:
    image: postgres:16-alpine
    container_name: roadie-flow-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: roadie
      POSTGRES_PASSWORD: roadie
      POSTGRES_DB: roadie_flow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadie -d roadie_flow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
