name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://roadie:roadie@localhost:5432/roadie_flow?schema=public
      AUTH_SECRET: ci-build-auth-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: ESLint
        run: yarn lint

      - name: Prettier
        run: yarn format:check

      - name: Build
        run: yarn build

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roadie
          POSTGRES_PASSWORD: roadie
          POSTGRES_DB: roadie_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadie -d roadie_flow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://roadie:roadie@localhost:5432/roadie_flow?schema=public
      AUTH_SECRET: ci-e2e-auth-secret-not-for-production-use
      SEED_DEMO_DATA: "true"
      SEED_ADMIN_EMAIL: admin@roadie.local
      SEED_ADMIN_PASSWORD: roadie-demo
      SEED_ROAD_STAFF_EMAIL: roadie@roadie.local
      SEED_ROAD_STAFF_PASSWORD: roadie-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Apply migrations
        run: yarn prisma migrate deploy

      - name: Seed demo data
        run: yarn db:seed

      - name: Build application
        run: yarn build

      - name: E2E tests
        run: yarn test:e2e
